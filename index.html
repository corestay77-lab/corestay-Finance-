const BILL=o=>{const e=!!o;o=o||{vendor:'',hotel:'',cat:'',amount:'',date:today(),due:off(14)};return[e?'Ubah tagihan '+o.no:'Catat tagihan',`<label>Vendor<input name="vendor" value="${esc(o.vendor)}" autocomplete="off"></label><label>Hotel<select name="hotel">${hs(o.hotel)}</select></label><label>Akun biaya<select name="cat">${catOpts(pBill,o.cat)}</select></label>${dtf('Tanggal tagihan','date',dOf(o))}${dtf('Jatuh tempo','due',o.due)}<label>Jumlah (Rp)<input name="amount" type="number" min="1" value="${o.amount}"></label><p class="sub mut">Catat jumlah sebelum PPN masukan. Gaji dicatat pada departemen tempat biaya timbul.</p>${e&&o.status==='Lunas'?'<p class="sub mut">Tagihan ini sudah lunas. Perubahan jumlah, hotel, dan akun ikut memperbarui transaksi kas terkait.</p>':''}`,e?'Simpan perubahan':'Simpan tagihan']};

const ACF=o=>{const e=!!o;o=o||{name:'',open:0};return[e?'Ubah rekening':'Tambah rekening',`<label>Nama rekening<input name="name" value="${esc(o.name)}" autocomplete="off"></label><label>Saldo awal (Rp)<input name="open" type="number" value="${o.open}"></label>`,e?'Simpan perubahan':'Simpan rekening']};
const VOID=(o,w)=>['Batalkan '+w+' '+o.no,P(esc(o.client||o.vendor)+' &middot; <b>'+rp(o.client!==undefined?tot(o):o.amount)+'</b>. Dokumen tetap tersimpan dengan status Batal dan tidak dihitung dalam piutang, utang, maupun laporan.')+'<label>Alasan pembatalan<input name="why" autocomplete="off"></label>','Batalkan '+w];
const FM={'new-inv':()=>INV(),'edit-inv':id=>INV(S.inv.find(z=>z.id===id)),'new-bill':()=>BILL(),'edit-bill':id=>BILL(S.bills.find(z=>z.id===id)),'new-tx':()=>TXF(),'edit-tx':id=>TXF(S.tx.find(z=>z.id===id)),'new-acc':()=>ACF(),'edit-acc':id=>ACF(S.acc.find(z=>z.id===id)),'void-inv':id=>VOID(S.inv.find(z=>z.id===id),'invoice'),'void-bill':id=>VOID(S.bills.find(z=>z.id===id),'tagihan'),
 'lock':()=>['Penutupan buku',P('Transaksi, invoice, dan tagihan bertanggal sampai tanggal ini tidak bisa diubah, dihapus, dibatalkan, atau dibuat baru. Kosongkan tanggal untuk membuka semua periode.')+dtf('Tutup buku sampai tanggal','date',S.lock||''),'Simpan']};
function confirmFor(k,id){
  if(k==='del-inv'){const i=S.inv.find(z=>z.id===id);return['Hapus draf invoice?',P('<b>'+i.no+'</b> &middot; '+esc(i.client)+' &middot; '+rp(tot(i))+'. Draf yang belum dikirim bisa dihapus dan tidak bisa dikembalikan.'),'Hapus']}
  if(k==='del-bill'){const b=S.bills.find(z=>z.id===id);return['Hapus tagihan?',P('<b>'+b.no+'</b> &middot; '+esc(b.vendor)+' &middot; '+rp(b.amount)+'. Tagihan yang belum disetujui bisa dihapus dan tidak bisa dikembalikan.'),'Hapus']}
  if(k==='unpay-inv'||k==='unpay-bill'){const o=(k==='unpay-inv'?S.inv:S.bills).find(z=>z.id===id);return['Batalkan pembayaran?',P('<b>'+o.no+'</b>: transaksi kas pembayarannya dihapus dan status kembali menjadi '+(k==='unpay-inv'?'Terkirim':'Disetujui')+'.'),'Batalkan pembayaran']}
  if(k==='del-tx'){const t=S.tx.find(z=>z.id===id),src=srcOf(t);return['Hapus transaksi?',P('<b>'+t.date+'</b> &middot; '+esc(t.note)+' &middot; '+rp(t.amount)+'. Data yang dihapus tidak bisa dikembalikan.'+(src?' Status '+src.no+' akan kembali menjadi '+(src.client?'Terkirim':'Disetujui')+'.':'')),'Hapus']}
  if(k==='del-acc'){const a=S.acc.find(z=>z.id===id),n=S.tx.filter(t=>t.acc===id).length;
    if(S.acc.length<2)return['Rekening tidak bisa dihapus',P('Minimal harus ada satu rekening.'),null];
    if(n)return['Rekening tidak bisa dihapus',P('<b>'+esc(a.name)+'</b> masih memiliki '+n+' transaksi. Pindahkan transaksinya ke rekening lain lewat menu Kas dan bank, atau hapus transaksinya terlebih dahulu.'),null];
    return['Hapus rekening?',P('<b>'+esc(a.name)+'</b> akan dihapus.'),'Hapus']}
  if(k==='wipe')return['Kosongkan semua data?',P('Semua invoice, tagihan, dan transaksi akan dihapus. Rekening tetap ada. Disarankan mengunduh cadangan lebih dulu.'),'Kosongkan'];
  if(k==='reset')return['Kembalikan data contoh?',P('Semua perubahan Anda akan diganti dengan data contoh.'),'Kembalikan'];
  if(k==='import')return['Pulihkan dari berkas?',P('Data di browser ini akan diganti: '+PEND.inv.length+' invoice, '+PEND.bills.length+' tagihan, '+PEND.tx.length+' transaksi, '+PEND.acc.length+' rekening.'),'Pulihkan'];
  if(k==='info')return[PEND.t,P(PEND.m),null]}
function openDlg(k,id){
  const d=$('#dlg');let t,b,s;
  if(FM[k])[t,b,s]=FM[k](id);
  else if(k==='pay-inv'||k==='pay-bill'){const o=(k==='pay-inv'?S.inv:S.bills).find(z=>z.id===id);t=k==='pay-inv'?'Terima pembayaran':'Bayar tagihan';b=`<p class="mut">${o.no} &middot; ${esc(o.client||o.vendor)} &middot; <b>${rp(k==='pay-inv'?tot(o):o.amount)}</b></p><label>${k==='pay-inv'?'Masuk ke rekening':'Bayar dari rekening'}<select name="acc">${accs()}</select></label><label>Tanggal<input name="date" type="date" value="${today()}"></label>`;s=k==='pay-inv'?'Catat pembayaran':'Bayar sekarang'}
  else[t,b,s]=confirmFor(k,id);
  const dz=/^(del|void|unpay)/.test(k)||k==='wipe';
  d.innerHTML=`<h2>${t}</h2><div id="fb" data-k="${k}" data-id="${id||''}">${b}</div><p class="err" id="er" role="alert"></p><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn2" data-act="close">${s?'Batal':'Tutup'}</button>${s?`<button class="btn${dz?' dgr':''}" data-act="save">${s}</button>`:''}</div>`;
  d.showModal();if($('#calc'))calcInv()}
const info=(t,m)=>{PEND={t,m};openDlg('info')};
const gv=n=>{const e=$('#fb [name='+n+']');return e?e.value.trim():''};
function calcInv(){const o={amount:+gv('amount')||0,svc:+gv('svc')||0,tax:+gv('tax')||0};$('#calc').innerHTML='Pendapatan tanpa pajak: <b>'+rp(net(o))+'</b> &middot; Pajak: <b>'+rp(tot(o)-net(o))+'</b> &middot; Total ditagih: <b>'+rp(tot(o))+'</b>'}
const vInv=()=>{const a=+gv('amount');return!gv('client')?'Isi nama klien.':!gv('cat')?'Pilih akun pendapatan.':!gv('date')?'Isi tanggal invoice.':!gv('due')?'Pilih tanggal jatuh tempo.':gv('due')<gv('date')?'Jatuh tempo tidak boleh sebelum tanggal invoice.':!(a>0)?'Jumlah harus lebih dari 0.':+gv('svc')<0||+gv('tax')<0?'Service charge dan pajak tidak boleh negatif.':lockMsg(gv('date'))};
const vBill=()=>{const a=+gv('amount');return!gv('vendor')?'Isi nama vendor.':!gv('cat')?'Pilih akun biaya.':!gv('date')?'Isi tanggal tagihan.':!gv('due')?'Pilih tanggal jatuh tempo.':gv('due')<gv('date')?'Jatuh tempo tidak boleh sebelum tanggal tagihan.':!(a>0)?'Jumlah harus lebih dari 0.':lockMsg(gv('date'))};
const nid=()=>{let n=1;while(S.acc.some(z=>z.id==='a'+n))n++;return'a'+n};
function syncTx(o,isInv){S.tx.filter(t=>t.ref===o.id).forEach(t=>{t.amount=isInv?tot(o):o.amount;t.hotel=o.hotel;t.cat=o.cat||'';t.note=(isInv?'Pelunasan ':'Pembayaran ')+o.no+' '+(isInv?o.client:o.vendor)})}
function lockFor(a,id){const ds=[];const m=/^(?:edit|del|void|unpay)-(inv|bill|tx)$/.exec(a);if(!m)return'';
  if(m[1]==='tx'){const t=S.tx.find(z=>z.id===id);ds.push(t.date)}else{const o=(m[1]==='inv'?S.inv:S.bills).find(z=>z.id===id);ds.push(dOf(o));S.tx.filter(t=>t.ref===id).forEach(t=>ds.push(t.date))}
  return ds.map(lockMsg).find(x=>x)||''}
function saveDlg(){
  const fb=$('#fb'),k=fb.dataset.k,id=fb.dataset.id,er=m=>{$('#er').textContent=m;return 0};
  if(k==='new-inv'||k==='edit-inv'){const m=vInv();if(m)return er(m);const f={client:gv('client'),hotel:gv('hotel'),cat:gv('cat'),date:gv('date'),due:gv('due'),amount:+gv('amount'),svc:+gv('svc')||0,taxType:gv('taxType'),tax:+gv('tax')||0};
    if(k==='new-inv'){const i=Object.assign({id:'i'+S.seq.i,no:'INV-'+String(S.seq.i++).padStart(4,'0'),status:'Draf',paidOn:''},f);S.inv.unshift(i);logA('Buat invoice '+i.no+' '+i.client)}
    else{const i=S.inv.find(z=>z.id===id);Object.assign(i,f);syncTx(i,true);logA('Ubah invoice '+i.no)}}
  else if(k==='new-bill'||k==='edit-bill'){const m=vBill();if(m)return er(m);const f={vendor:gv('vendor'),hotel:gv('hotel'),cat:gv('cat'),date:gv('date'),due:gv('due'),amount:+gv('amount')};
    if(k==='new-bill'){const b=Object.assign({id:'b'+S.seq.b,no:'TG-'+String(S.seq.b++).padStart(4,'0'),tax:0,status:'Menunggu',paidOn:''},f);S.bills.unshift(b);logA('Catat tagihan '+b.no+' '+b.vendor)}
    else{const b=S.bills.find(z=>z.id===id);Object.assign(b,f);syncTx(b,false);logA('Ubah tagihan '+b.no)}}
  else if(k==='new-tx'||k==='edit-tx'){const t0=k==='edit-tx'?S.tx.find(z=>z.id===id):null,lk=t0&&srcOf(t0),a=+gv('amount'),dt=gv('date')||today();
    if(!gv('note'))return er('Isi keterangan transaksi.');if(!lk&&!(a>0))return er('Jumlah harus lebih dari 0.');if(!lk&&!gv('cat'))return er('Pilih akun transaksi.');const lm=lockMsg(dt);if(lm)return er(lm);
    if(!t0){S.tx.push({id:'x'+S.seq.t++,date:dt,acc:gv('acc'),type:gv('type'),amount:a,hotel:gv('hotel'),note:gv('note'),rec:false,cat:gv('cat')});logA('Catat transaksi '+gv('note')+' '+rp(a))}
    else{t0.acc=gv('acc');t0.date=dt;t0.note=gv('note');if(!lk){t0.type=gv('type');t0.cat=gv('cat');t0.hotel=gv('hotel');t0.amount=a}logA('Ubah transaksi '+t0.note)}}
  else if(k==='new-acc'||k==='edit-acc'){const n=gv('name');if(!n)return er('Isi nama rekening.');if(S.acc.some(z=>z.id!==id&&z.name.toLowerCase()===n.toLowerCase()))return er('Nama rekening sudah dipakai.');
    if(k==='new-acc'){S.acc.push({id:nid(),name:n,open:+gv('open')||0,c:S.acc.length%5+1});logA('Tambah rekening '+n)}
    else{const a=S.acc.find(z=>z.id===id);a.name=n;a.open=+gv('open')||0;logA('Ubah rekening '+n)}}
  else if(k==='pay-inv'){const i=S.inv.find(z=>z.id===id),dt=gv('date')||today(),lm=lockMsg(dt);if(lm)return er(lm);i.status='Lunas';i.paidOn=dt;S.tx.push({id:'x'+S.seq.t++,date:dt,acc:gv('acc'),type:'in',amount:tot(i),hotel:i.hotel,note:'Pelunasan '+i.no+' '+i.client,rec:false,ref:i.id,cat:i.cat||''});logA('Terima pembayaran '+i.no)}
  else if(k==='pay-bill'){const b=S.bills.find(z=>z.id===id),dt=gv('date')||today(),lm=lockMsg(dt);if(lm)return er(lm);b.status='Lunas';b.paidOn=dt;S.tx.push({id:'x'+S.seq.t++,date:dt,acc:gv('acc'),type:'out',amount:b.amount,hotel:b.hotel,note:'Pembayaran '+b.no+' '+b.vendor,rec:false,ref:b.id,cat:b.cat||''});logA('Bayar tagihan '+b.no)}
  else if(k==='void-inv'||k==='void-bill'){const o=(k==='void-inv'?S.inv:S.bills).find(z=>z.id===id);if(!gv('why'))return er('Isi alasan pembatalan.');o.status='Batal';o.voidWhy=gv('why');logA('Batalkan '+o.no+': '+gv('why'))}
  else if(k==='unpay-inv'||k==='unpay-bill'){const o=(k==='unpay-inv'?S.inv:S.bills).find(z=>z.id===id);S.tx=S.tx.filter(t=>t.ref!==id);o.status=k==='unpay-inv'?'Terkirim':'Disetujui';o.paidOn='';logA('Batalkan pembayaran '+o.no)}
  else if(k==='del-inv'){const i=S.inv.find(z=>z.id===id);S.inv=S.inv.filter(z=>z.id!==id);logA('Hapus draf invoice '+i.no)}
  else if(k==='del-bill'){const b=S.bills.find(z=>z.id===id);S.bills=S.bills.filter(z=>z.id!==id);logA('Hapus tagihan '+b.no)}
  else if(k==='del-tx'){const t=S.tx.find(z=>z.id===id),src=srcOf(t);if(src){src.status=src.client?'Terkirim':'Disetujui';src.paidOn=''}S.tx=S.tx.filter(z=>z.id!==id);logA('Hapus transaksi '+t.note+(src?' (pembayaran '+src.no+' dibatalkan)':''))}
  else if(k==='del-acc'){const a=S.acc.find(z=>z.id===id);S.acc=S.acc.filter(z=>z.id!==id);logA('Hapus rekening '+a.name)}
  else if(k==='lock'){S.lock=gv('date');logA(S.lock?'Tutup buku sampai '+S.lock:'Buka semua periode')}
  else if(k==='wipe'){S.inv=[];S.bills=[];S.tx=[];S.seq={i:1,b:1,t:1};logA('Kosongkan data')}
  else if(k==='import'){S=PEND;PEND=null;logA('Data dipulihkan dari berkas cadangan')}
  else if(k==='reset'){S=seed();logA('Data contoh dikembalikan')}
  save();$('#dlg').close();render()}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'corestay-finance',version:VER,exported:new Date().toISOString(),data:S},null,2)],{type:'application/json'}));a.download='corestay-finance-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function readBackup(file){const r=new FileReader();r.onerror=()=>info('Berkas tidak bisa dibaca','Coba pilih berkas lain.');r.onload=()=>{try{let d=JSON.parse(r.result);d=d&&d.data?d.data:d;
  if(!d||d.v!==2||!['acc','inv','bills','tx'].every(x=>Array.isArray(d[x])))throw 0;if(!d.acc.length||!d.acc.every(a=>a&&a.id&&typeof a.name==='string'&&isFinite(a.open)))throw 0;
  if(!d.inv.every(i=>i&&i.id&&isFinite(i.amount)&&i.due)||!d.bills.every(b=>b&&b.id&&isFinite(b.amount)&&b.due)||!d.tx.every(t=>t&&t.id&&isFinite(t.amount)&&t.date&&d.acc.some(a=>a.id===t.acc)))throw 0;
  const mx=(a,p)=>a.reduce((m,x)=>Math.max(m,+String(x.no||'').replace(/\D/g,'')||0),0)+1;
  d.seq={i:Math.max(mx(d.inv),d.seq&&+d.seq.i||0),b:Math.max(mx(d.bills),d.seq&&+d.seq.b||0),t:Math.max(d.tx.length+1,d.seq&&+d.seq.t||0)};
  PEND=d;openDlg('import')}catch(e){info('Berkas tidak valid','Pilih berkas cadangan (.json) yang diunduh dari aplikasi CoreStay Finance.')}};r.readAsText(file)}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  const lm=lockFor(a,id);if(lm){info('Periode sudah ditutup',lm);return}
 if(a==='close')$('#dlg').close();
 else if(a==='save')saveDlg();
 else if(a==='chip'){UI.st=v;render()}
 else if(a==='per'){UI.per=v;render()}
  else if(a==='basis'){UI.basis=v;render()}
  else if(a==='toggle-all'){UI.all=!UI.all;render()}
  else if(a==='export')exportData();
  else if(a==='import')$('#imp').click();
 else if(a==='send'){const i=S.inv.find(z=>z.id===id);i.status='Terkirim';logA('Kirim invoice '+i.no);save();render()}
 else if(a==='appr'){const b=S.bills.find(z=>z.id===id);b.status='Disetujui';logA('Setujui tagihan '+b.no);save();render()}
 else if(a==='rec'){const t=S.tx.find(z=>z.id===id);t.rec=!t.rec;save();render()}
 else if(a==='theme'){const r=document.documentElement,dk=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('corestay-theme',r.dataset.theme)}catch(x){}render()}
 else openDlg(a,id)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='imp'&&t.files[0]){readBackup(t.files[0]);t.value='';return}
  if(!t.closest||!t.closest('#fb'))return;
  if(t.name==='taxType'){$('#fb [name=tax]').value={PBJT:10,PPN:11,NONE:0}[t.value];if($('#calc'))calcInv()}
  if(t.name==='type'){const c=$('#fb [name=cat]');if(c&&!c.disabled)c.innerHTML=catOpts(t.value==='in'?pIn:pOut,'')}});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#fb')&&$('#calc'))calcInv()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('#fb')&&e.target.tagName==='INPUT'&&$('#dlg [data-act=save]')){e.preventDefault();saveDlg()}});
function route(){const h=location.hash.slice(1);UI.v=Object.prototype.hasOwnProperty.call(V,h)?h:'dashboard';render();window.scrollTo(0,0)}
try{const t=localStorage.getItem('corestay-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
addEventListener('hashchange',route);route();
</script></body></html>
