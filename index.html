<div class="app"><aside class="side"><div class="brand"><img src="assets/logo.png" alt="CoreStay Advisory" width="300" height="249"><span>Finance</span></div><nav id="nav" aria-label="Menu Finance"></nav></aside><main class="main" id="main"></main></div>
<dialog id="dlg"></dialog>
<script>
const CFG=window.CORESTAY||{};
const KEY='corestay-finance-v1',HOTELS=['Bandung','Jakarta','Bali','Surabaya'];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const T0=()=>{const d=new Date();d.setHours(0,0,0,0);return d},today=()=>fd(T0());
const off=n=>{const d=T0();d.setDate(d.getDate()+n);return fd(d)};
const days=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const sh=n=>{const a=Math.abs(n);return(n<0?'-':'')+'Rp '+(a>=1e9?(a/1e9).toFixed(1).replace('.',',')+' M':a>=1e6?Math.round(a/1e6)+' jt':Math.round(a).toLocaleString('id-ID'))};
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),tot=i=>i.amount*(1+i.tax/100);
function seed(){
 const acc=[{id:'a1',name:'Rekening operasional',open:3.8e9,c:1},{id:'a2',name:'Rekening payroll',open:1.5e9,c:5},{id:'a3',name:'Rekening cadangan',open:6e8,c:2}];
 const inv=[['PT Maju Bersama','Bandung',1e8,12,'Terkirim'],['PT Sinar Wisata','Bali',85e7,8,'Draf'],['Dinas Pariwisata','Jakarta',6.4e7,-5,'Terkirim'],['PT Karya Nusa','Surabaya',3.8e7,-9,'Lunas'],['CV Lintas Wisata','Bali',1.2e8,-40,'Terkirim'],['PT Harmoni','Bandung',7.5e7,20,'Terkirim']].map((r,i)=>({id:'i'+i,no:'INV-'+String(i+1).padStart(4,'0'),client:r[0],hotel:r[1],amount:r[2],tax:11,due:off(r[3]),status:r[4],paidOn:r[4]==='Lunas'?off(-8):''}));
 const bills=[['Vendor F&B A','Bandung','Bahan baku',8.4e7,2,'Menunggu'],['Vendor Linen B','Bali','Perlengkapan',5.2e7,3,'Disetujui'],['Vendor Listrik C','Jakarta','Utilitas',1.1e8,-2,'Disetujui'],['Vendor Servis D','Surabaya','Perawatan',2.4e7,-9,'Lunas'],['Vendor Kebersihan E','Jakarta','Perlengkapan',3.6e7,10,'Menunggu']].map((r,i)=>({id:'b'+i,no:'TG-'+String(i+1).padStart(4,'0'),vendor:r[0],hotel:r[1],cat:r[2],amount:r[3],tax:0,due:off(r[4]),status:r[5],paidOn:r[5]==='Lunas'?off(-8):''}));
 const tx=[],w=[.3,.3,.25,.15],ins=[1.5e9,1.4e9,1.55e9,1.3e9,1.45e9,1.1e9],outs=[1.1e9,1.15e9,1e9,1.2e9,1.05e9,.8e9],n=T0();
 for(let k=0;k<6;k++){const m=5-k,d=new Date(n.getFullYear(),n.getMonth()-m,m===0?Math.min(10,n.getDate()):10);
  HOTELS.forEach((h,j)=>{tx.push({id:'t'+k+'i'+j,date:fd(d),acc:'a1',type:'in',amount:Math.round(ins[k]*w[j]),hotel:h,note:'Pendapatan kamar dan F&B',rec:true});tx.push({id:'t'+k+'o'+j,date:fd(d),acc:j%2?'a2':'a1',type:'out',amount:Math.round(outs[k]*w[j]),hotel:h,note:'Biaya operasional',rec:k<5})})}
 return{acc,inv,bills,tx,seq:{i:7,b:6,t:1}}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
let S=load();const UI={f:'Semua',v:'dashboard',st:'Semua',per:'bulan'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const F=a=>UI.f==='Semua'?a:a.filter(x=>x.hotel===UI.f);
const iSt=i=>i.status==='Lunas'?'Lunas':i.status==='Draf'?'Draf':(i.due<today()?'Terlambat':'Terkirim');
const bSt=b=>b.status==='Lunas'?'Lunas':b.due<today()?'Terlambat':b.status;
const PC={Lunas:'p2',Terkirim:'p5',Draf:'p1',Terlambat:'p4',Menunggu:'p3',Disetujui:'p1'},LB={Menunggu:'Menunggu approval'};
const pill=s=>`<span class="pill ${PC[s]}">${LB[s]||s}</span>`;
const bal=a=>a.open+sum(S.tx.filter(t=>t.acc===a.id),t=>t.type==='in'?t.amount:-t.amount);
const ym=d=>d.slice(0,7),TM=()=>today().slice(0,7);
const K=(c,l,v,s)=>`<div class="kc b${c}"><p class="k">${l}</p><p class="v">${v}</p><p class="sub">${s}</p></div>`;
const C=(t,b,f)=>`<div class="card" style="flex:${f||'1 1 360px'}"><h2>${t}</h2>${b}</div>`;
const LI=(a,b)=>`<div class="li"><span>${a}</span>${b}</div>`;
const BAR=(l,v,p,c)=>`<div class="row" style="flex-wrap:nowrap"><span style="flex:0 0 96px">${l}</span><div class="bar"><div style="width:${Math.max(p,2)}%;background:${c}"></div></div><b style="flex:0 0 84px;text-align:right">${v}</b></div>`;
const COL=['#5B3DF5','#FFD23F','#2EE6A6','#FF7AB6','#5CC8FF'];
const NAV=[['dashboard','Dashboard'],['invoice','Invoice dan piutang'],['utang','Utang dan pembayaran'],['kas','Kas dan bank'],['laporan','Laporan']];
const V={
dashboard(){
 const inv=F(S.inv).filter(i=>iSt(i)!=='Draf'&&i.status!=='Lunas'),piu=sum(inv,tot),bl=F(S.bills).filter(b=>b.status!=='Lunas'),u7=bl.filter(b=>b.due<=off(7));
 const mt=F(S.tx).filter(t=>ym(t.date)===TM()),laba=sum(mt,t=>t.type==='in'?t.amount:-t.amount),late=sum(inv.filter(i=>iSt(i)==='Terlambat'),tot);
 const ag=[0,0,0,0];inv.forEach(i=>{const d=days(today(),i.due);ag[d<=0?0:d<=30?1:d<=60?2:3]+=tot(i)});
 const at=sum(ag,x=>x),lab=['Belum jatuh tempo','Telat 1-30 hari','Telat 31-60 hari','Telat lebih dari 60 hari'],cc=['#2EE6A6','#FFD23F','#FF7AB6','#5B3DF5'];
 let a=0;const bg=at?'conic-gradient('+ag.map((v,k)=>{const s=a;a+=v/at*100;return cc[k]+' '+s+'% '+a+'%'}).join(',')+')':'var(--track)';
 const donut=`<div class="row" style="gap:20px"><div style="width:150px;height:150px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;flex:none"><div style="width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center"><b>${sh(piu)}</b><span class="sub">Piutang</span></div></div><div style="display:flex;flex-direction:column;gap:8px;font-size:14px">${ag.map((v,k)=>`<span><span class="dot" style="background:${cc[k]};display:inline-block;margin-right:8px"></span>${lab[k]}: ${sh(v)}</span>`).join('')}</div></div>`;
 const hp=HOTELS.map(h=>sum(S.tx.filter(t=>t.hotel===h&&t.type==='in'&&ym(t.date)===TM()),t=>t.amount)),mx=Math.max(...hp,1);
 const need=bl.sort((x,y)=>x.due<y.due?-1:1).slice(0,4),ov=inv.filter(i=>iSt(i)==='Terlambat').slice(0,4);
 return G(K(1,'Posisi kas',sh(sum(S.acc,bal)),S.acc.length+' rekening')+K(2,'Piutang berjalan',sh(piu),'Terlambat '+sh(late))+K(4,'Utang jatuh tempo 7 hari',sh(sum(u7,x=>x.amount)),u7.length+' tagihan')+K(3,'Selisih kas bulan ini',sh(laba),'Masuk dikurangi keluar'))+
 FL(C('Umur piutang',donut)+C('Pendapatan bulan ini per hotel',hp.map((v,k)=>BAR(HOTELS[k],sh(v),v/mx*100,COL[k])).join('')))+
 FL(C('Tagihan yang perlu aksi',need.length?need.map(b=>LI(esc(b.vendor)+' <span class="mut">'+sh(b.amount)+'</span>',pill(bSt(b)))).join(''):'<p class="empty">Semua tagihan sudah lunas.</p>')+C('Piutang terlambat',ov.length?ov.map(i=>LI(esc(i.client)+' <span class="mut">'+sh(tot(i))+'</span>',pill('Terlambat'))).join(''):'<p class="empty">Tidak ada piutang terlambat.</p>'))},
invoice(){
 const all=F(S.inv),list=all.filter(i=>UI.st==='Semua'||iSt(i)===UI.st),op=all.filter(i=>i.status!=='Lunas'&&i.status!=='Draf');
 const chips=['Semua','Draf','Terkirim','Terlambat','Lunas'].map(s=>`<button class="btn2 sm${UI.st===s?' on':''}" data-act="chip" data-v="${s}">${s}</button>`).join('');
 const rows=list.map(i=>{const s=iSt(i);return`<tr><td><b>${i.no}</b></td><td>${esc(i.client)}</td><td>${i.hotel}</td><td class="r">${rp(tot(i))}</td><td>${i.due}</td><td>${pill(s)}</td><td class="r">${s==='Draf'?`<button class="btn2 sm" data-act="send" data-id="${i.id}">Kirim</button> `:s==='Lunas'?'':`<button class="btn2 sm" data-act="pay-inv" data-id="${i.id}">Terima bayar</button> `}<button class="btn2 sm" data-act="del-inv" data-id="${i.id}">Hapus</button></td></tr>`}).join('');
 return G(K(1,'Total piutang',sh(sum(op,tot)),op.length+' invoice terbuka')+K(4,'Terlambat',sh(sum(op.filter(i=>iSt(i)==='Terlambat'),tot)),op.filter(i=>iSt(i)==='Terlambat').length+' invoice')+K(2,'Draf',all.filter(i=>i.status==='Draf').length+'','Belum dikirim')+K(3,'Dibayar bulan ini',sh(sum(all.filter(i=>i.status==='Lunas'&&ym(i.paidOn)===TM()),tot)),'Invoice lunas'))+
 `<div class="card"><div class="row">${chips}</div>${TB(['No. invoice','Klien','Hotel','Total','Jatuh tempo','Status',''],rows,'Belum ada invoice. Pilih Buat invoice untuk memulai.')}</div>`},
utang(){
 const all=F(S.bills),list=all,op=all.filter(b=>b.status!=='Lunas'),mp=op.filter(b=>b.status==='Menunggu');
 const rows=list.map(b=>`<tr><td><b>${b.no}</b></td><td>${esc(b.vendor)}</td><td>${b.hotel}</td><td>${esc(b.cat)}</td><td class="r">${rp(b.amount)}</td><td>${b.due}</td><td>${pill(bSt(b))}</td><td class="r">${b.status==='Menunggu'?`<button class="btn2 sm" data-act="appr" data-id="${b.id}">Setujui</button> `:b.status==='Disetujui'?`<button class="btn2 sm" data-act="pay-bill" data-id="${b.id}">Bayar</button> `:''}<button class="btn2 sm" data-act="del-bill" data-id="${b.id}">Hapus</button></td></tr>`).join('');
 return G(K(5,'Total utang',sh(sum(op,x=>x.amount)),op.length+' tagihan terbuka')+K(4,'Jatuh tempo 7 hari',sh(sum(op.filter(b=>b.due<=off(7)),x=>x.amount)),op.filter(b=>b.due<=off(7)).length+' tagihan')+K(2,'Menunggu approval',mp.length+'',sh(sum(mp,x=>x.amount)))+K(3,'Dibayar bulan ini',sh(sum(all.filter(b=>b.status==='Lunas'&&ym(b.paidOn)===TM()),x=>x.amount)),'Tagihan lunas'))+
 `<div class="card">${TB(['No. tagihan','Vendor','Hotel','Kategori','Jumlah','Jatuh tempo','Status',''],rows,'Belum ada tagihan. Pilih Catat tagihan untuk memulai.')}</div>`},
kas(){
 const tx=F(S.tx).slice().sort((a,b)=>a.date<b.date?1:-1);
 const ms=[];for(let k=5;k>=0;k--){const d=new Date(T0().getFullYear(),T0().getMonth()-k,1);ms.push({y:d.getFullYear()+'-'+pad(d.getMonth()+1),l:d.toLocaleDateString('id-ID',{month:'short'})})}
 const dt=ms.map(m=>({l:m.l,i:sum(F(S.tx).filter(t=>ym(t.date)===m.y&&t.type==='in'),t=>t.amount),o:sum(F(S.tx).filter(t=>ym(t.date)===m.y&&t.type==='out'),t=>t.amount)})),mx=Math.max(...dt.map(x=>Math.max(x.i,x.o)),1);
 const ch=dt.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="display:flex;align-items:flex-end;gap:6px;height:160px"><div title="Masuk ${sh(x.i)}" style="width:18px;height:${Math.max(x.i/mx*160,3)}px;border-radius:8px;background:#2EE6A6"></div><div title="Keluar ${sh(x.o)}" style="width:18px;height:${Math.max(x.o/mx*160,3)}px;border-radius:8px;background:#FF7AB6"></div></div><span class="sub">${x.l}</span></div>`).join('');
 const leg='<div class="row" style="font-size:13px"><span><span class="dot" style="background:#2EE6A6;display:inline-block;margin-right:6px"></span>Kas masuk</span><span><span class="dot" style="background:#FF7AB6;display:inline-block;margin-right:6px"></span>Kas keluar</span></div>';
 const rows=tx.slice(0,12).map(t=>`<tr><td>${t.date}</td><td>${esc(t.note)}</td><td>${t.hotel}</td><td>${S.acc.find(a=>a.id===t.acc).name}</td><td class="r"><b>${t.type==='in'?'+':'-'}${rp(t.amount)}</b></td><td class="r"><button class="btn2 sm${t.rec?' on':''}" data-act="rec" data-id="${t.id}" aria-pressed="${t.rec}">${t.rec?'Cocok':'Belum cocok'}</button></td></tr>`).join('');
 return G(S.acc.map(a=>K(a.c,a.name,sh(bal(a)),'Saldo saat ini')).join('')+K(3,'Belum direkonsiliasi',S.tx.filter(t=>!t.rec).length+'','Transaksi perlu dicocokkan'))+
 FL(C('Arus kas 6 bulan',leg+'<div class="row" style="flex-wrap:nowrap;align-items:flex-end">'+ch+'</div>','2 1 460px'))+
 `<div class="card"><h2>Transaksi terbaru</h2>${TB(['Tanggal','Keterangan','Hotel','Rekening','Jumlah','Rekonsiliasi'],rows,'Belum ada transaksi.')}</div>`},
laporan(){
 const per=UI.per==='bulan'?(t=>ym(t.date)===TM()):(()=>true),rows=HOTELS.map(h=>{const t=S.tx.filter(x=>x.hotel===h&&per(x)),i=sum(t.filter(x=>x.type==='in'),x=>x.amount),o=sum(t.filter(x=>x.type==='out'),x=>x.amount);return{h,i,o,l:i-o}});
 const ti=sum(rows,r=>r.i),to=sum(rows,r=>r.o),tr=rows.map(r=>`<tr><td><b>Hotel ${r.h}</b></td><td class="r">${rp(r.i)}</td><td class="r">${rp(r.o)}</td><td class="r"><b>${rp(r.l)}</b></td><td class="r">${r.i?Math.round(r.l/r.i*100)+'%':'-'}</td></tr>`).join('')+`<tr><td><b>Total grup</b></td><td class="r"><b>${rp(ti)}</b></td><td class="r"><b>${rp(to)}</b></td><td class="r"><b>${rp(ti-to)}</b></td><td class="r"><b>${ti?Math.round((ti-to)/ti*100)+'%':'-'}</b></td></tr>`;
 return `<div class="card"><div class="row"><button class="btn2 sm${UI.per==='bulan'?' on':''}" data-act="per" data-v="bulan">Bulan ini</button><button class="btn2 sm${UI.per==='semua'?' on':''}" data-act="per" data-v="semua">6 bulan terakhir</button></div><h2>Laba rugi ringkas per hotel</h2>${TB(['Hotel','Pendapatan','Biaya','Laba','Margin'],tr,'')}<p class="sub mut">Dihitung dari transaksi kas yang tercatat di menu Kas dan bank.</p></div>
 <div class="card"><h2>Data contoh</h2><p class="mut">Data tersimpan di browser ini saja. Anda bisa mengembalikan ke data awal kapan saja.</p><div><button class="btn2" data-act="reset">Kembalikan data contoh</button></div></div>`}};
const G=h=>`<div class="g">${h}</div>`,FL=h=>`<div class="fl">${h}</div>`;
const TB=(h,r,e)=>r?`<div class="tw"><table><thead><tr>${h.map((x,i)=>`<th${/Total|Jumlah|Pendapatan|Biaya|Laba|Margin|Rekonsiliasi/.test(x)||x===''?' class="r"':''}>${x}</th>`).join('')}</tr></thead><tbody>${r}</tbody></table></div>`:`<p class="empty">${e}</p>`;
const TITLES={dashboard:['Dashboard Finance','Posisi keuangan hotel hari ini.'],invoice:['Invoice dan piutang','Tagih klien dan pantau pembayaran.'],utang:['Utang dan pembayaran','Setujui dan bayar tagihan vendor.'],kas:['Kas dan bank','Saldo rekening, arus kas, dan rekonsiliasi.'],laporan:['Laporan','Ringkasan laba rugi per hotel.']};
const ACT={invoice:['Buat invoice','new-inv'],utang:['Catat tagihan','new-bill'],kas:['Catat transaksi','new-tx']};
function render(){
 $('#nav').innerHTML=NAV.map(([id,l],k)=>`<a href="#${id}"${UI.v===id?' aria-current="page"':''}><span class="dot" style="background:${COL[k]}"></span>${l}</a>`).join('')+(CFG.executiveUrl?'<a href="'+CFG.executiveUrl+'"><span class="dot" style="background:#B9A8FF"></span>Executive</a>':'');
 const t=TITLES[UI.v],a=ACT[UI.v],dark=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
 $('#main').innerHTML=`<div class="hd"><div><h1>${t[0]}</h1><p class="mut">${t[1]}</p></div><div class="row"><select id="hf" aria-label="Filter hotel"><option>Semua</option>${HOTELS.map(h=>`<option${UI.f===h?' selected':''}>${h}</option>`).join('')}</select><button class="btn2" data-act="theme">${dark?'Mode terang':'Mode gelap'}</button>${a?`<button class="btn" data-act="${a[1]}">${a[0]}</button>`:''}</div></div>`+V[UI.v]();
 const f=$('#hf');f.value=UI.f;f.onchange=()=>{UI.f=f.value;render()}}
const hs=()=>HOTELS.map(h=>`<option>${h}</option>`).join(''),accs=()=>S.acc.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
const FM={
'new-inv':['Buat invoice',`<label>Klien<input name="client" autocomplete="off"></label><label>Hotel<select name="hotel">${hs()}</select></label><label>Jumlah sebelum pajak (Rp)<input name="amount" type="number" min="1"></label><label>PPN (%)<input name="tax" type="number" min="0" value="11"></label><label>Jatuh tempo<input name="due" type="date" value="${off(30)}"></label>`,'Simpan sebagai draf'],
'new-bill':['Catat tagihan',`<label>Vendor<input name="vendor" autocomplete="off"></label><label>Hotel<select name="hotel">${hs()}</select></label><label>Kategori<select name="cat"><option>Bahan baku</option><option>Utilitas</option><option>Perlengkapan</option><option>Perawatan</option><option>Lainnya</option></select></label><label>Jumlah (Rp)<input name="amount" type="number" min="1"></label><label>Jatuh tempo<input name="due" type="date" value="${off(14)}"></label>`,'Simpan tagihan'],
'new-tx':['Catat transaksi',`<label>Jenis<select name="type"><option value="in">Kas masuk</option><option value="out">Kas keluar</option></select></label><label>Rekening<select name="acc">${accs()}</select></label><label>Hotel<select name="hotel">${hs()}</select></label><label>Keterangan<input name="note" autocomplete="off"></label><label>Jumlah (Rp)<input name="amount" type="number" min="1"></label><label>Tanggal<input name="date" type="date" value="${today()}"></label>`,'Simpan transaksi']};
function open(k,id,x){
 const d=$('#dlg');let t,b,s;
 if(FM[k])[t,b,s]=FM[k];
 else if(k==='pay-inv'||k==='pay-bill'){const o=(k==='pay-inv'?S.inv:S.bills).find(z=>z.id===id);t=k==='pay-inv'?'Terima pembayaran':'Bayar tagihan';b=`<p class="mut">${o.no} &middot; ${esc(o.client||o.vendor)} &middot; <b>${rp(k==='pay-inv'?tot(o):o.amount)}</b></p><label>${k==='pay-inv'?'Masuk ke rekening':'Bayar dari rekening'}<select name="acc">${accs()}</select></label><label>Tanggal<input name="date" type="date" value="${today()}"></label>`;s=k==='pay-inv'?'Catat pembayaran':'Bayar sekarang'}
 else{t=k==='reset'?'Kembalikan data contoh?':'Hapus data ini?';b='<p class="mut">'+(k==='reset'?'Semua perubahan Anda akan diganti dengan data contoh.':'Data yang dihapus tidak bisa dikembalikan.')+'</p>';s=k==='reset'?'Kembalikan':'Hapus'}
 d.innerHTML=`<h2>${t}</h2><div id="fb" data-k="${k}" data-id="${id||''}">${b}</div><p class="err" id="er" role="alert"></p><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn2" data-act="close">Batal</button><button class="btn" data-act="save">${s}</button></div>`;
 d.showModal()}
const gv=n=>{const e=$('#fb [name='+n+']');return e?e.value.trim():''};
function saveDlg(){
 const fb=$('#fb'),k=fb.dataset.k,id=fb.dataset.id,er=m=>{$('#er').textContent=m;return 0};
 if(k==='new-inv'){const a=+gv('amount');if(!gv('client'))return er('Isi nama klien.');if(!(a>0))return er('Jumlah harus lebih dari 0.');if(!gv('due'))return er('Pilih tanggal jatuh tempo.');S.inv.unshift({id:'i'+S.seq.i,no:'INV-'+String(S.seq.i++).padStart(4,'0'),client:gv('client'),hotel:gv('hotel'),amount:a,tax:+gv('tax')||0,due:gv('due'),status:'Draf',paidOn:''})}
 else if(k==='new-bill'){const a=+gv('amount');if(!gv('vendor'))return er('Isi nama vendor.');if(!(a>0))return er('Jumlah harus lebih dari 0.');if(!gv('due'))return er('Pilih tanggal jatuh tempo.');S.bills.unshift({id:'b'+S.seq.b,no:'TG-'+String(S.seq.b++).padStart(4,'0'),vendor:gv('vendor'),hotel:gv('hotel'),cat:gv('cat'),amount:a,tax:0,due:gv('due'),status:'Menunggu',paidOn:''})}
 else if(k==='new-tx'){const a=+gv('amount');if(!gv('note'))return er('Isi keterangan transaksi.');if(!(a>0))return er('Jumlah harus lebih dari 0.');S.tx.push({id:'x'+S.seq.t++,date:gv('date')||today(),acc:gv('acc'),type:gv('type'),amount:a,hotel:gv('hotel'),note:gv('note'),rec:false})}
 else if(k==='pay-inv'){const i=S.inv.find(z=>z.id===id);i.status='Lunas';i.paidOn=gv('date')||today();S.tx.push({id:'x'+S.seq.t++,date:i.paidOn,acc:gv('acc'),type:'in',amount:tot(i),hotel:i.hotel,note:'Pelunasan '+i.no+' '+i.client,rec:false})}
 else if(k==='pay-bill'){const b=S.bills.find(z=>z.id===id);b.status='Lunas';b.paidOn=gv('date')||today();S.tx.push({id:'x'+S.seq.t++,date:b.paidOn,acc:gv('acc'),type:'out',amount:b.amount,hotel:b.hotel,note:'Pembayaran '+b.no+' '+b.vendor,rec:false})}
 else if(k==='del-inv')S.inv=S.inv.filter(z=>z.id!==id);
 else if(k==='del-bill')S.bills=S.bills.filter(z=>z.id!==id);
 else if(k==='reset')S=seed();
 save();$('#dlg').close();render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
 if(a==='close')$('#dlg').close();
 else if(a==='save')saveDlg();
 else if(a==='chip'){UI.st=v;render()}
 else if(a==='per'){UI.per=v;render()}
 else if(a==='send'){S.inv.find(z=>z.id===id).status='Terkirim';save();render()}
 else if(a==='appr'){S.bills.find(z=>z.id===id).status='Disetujui';save();render()}
 else if(a==='rec'){const t=S.tx.find(z=>z.id===id);t.rec=!t.rec;save();render()}
 else if(a==='theme'){const r=document.documentElement,dk=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('corestay-theme',r.dataset.theme)}catch(x){}render()}
 else open(a,id)});
function route(){const h=location.hash.slice(1);UI.v=V[h]?h:'dashboard';render();window.scrollTo(0,0)}
try{const t=localStorage.getItem('corestay-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
addEventListener('hashchange',route);route();
</script></body></html>
